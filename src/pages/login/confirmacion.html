<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmación – Objetos Perdidos UNIVA</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; }
    .confirm-wrap { width: 100%; max-width: 380px; padding: 16px; }
    .confirm-wrap h2 { text-align: center; font-size: 20px; margin: 0 0 20px; }
  </style>
</head>
<body>
  <div class="confirm-wrap">
    <div class="card">
      <h2>Confirma tus datos</h2>

      <div class="confirm-box">
        <div class="avatar">👤</div>
        <span class="role-badge" id="rolBadge">–</span>

        <div class="data-list" id="datosUsuario">
          <div class="row"><span>Nombre</span>    <span id="uNombre">–</span></div>
          <div class="row"><span>Correo</span>    <span id="uCorreo">–</span></div>
          <div class="row"><span>Matrícula</span> <span id="uMatricula">–</span></div>
        </div>

        <p style="color:var(--muted);font-size:12px;text-align:center;margin:0">
          ¿Eres tú? Pulsa <strong>Acceder</strong> para continuar.
        </p>

        <button id="btnAcceder" class="btn btn-primary btn-block">Acceder</button>
        <a href="../../index.html" class="btn btn-secondary btn-block" style="text-align:center">
          No soy yo — volver
        </a>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../../js/api.js"></script>
  <script>
    /* PNT-02: solo muestra los datos devueltos por PNT-01; no hace llamada a la API */
    $(function () {
      const u = Session.get();
      if (!u) {
        /* Si no hay sesión, volver al login */
        window.location.href = '../../index.html';
        return;
      }

      /* Rellenar la vista con los datos del UsuarioDTO */
      $('#uNombre').text(u.nombre   || '–');
      $('#uCorreo').text(u.correo   || '–');
      $('#uMatricula').text(u.matricula || '–');
      $('#rolBadge').text(u.rol === 'ADMINISTRADOR' ? 'Administrador' : 'Estudiante');

      /* El botón Acceder solo navega, no llama a la API */
      $('#btnAcceder').on('click', function () {
        if (u.rol === 'ADMINISTRADOR') {
          window.location.href = '../admin/principal.html';
        } else {
          window.location.href = '../estudiante/principal.html';
        }
      });
    });
  </script>
</body>
</html>
